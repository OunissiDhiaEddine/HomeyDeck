name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (created on the current commit if missing)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go test ./...
        working-directory: agent
      - run: ./agent/build.sh "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: agent
          path: agent/dist/homeydeck-agent.exe

  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app (ad-hoc signed)
        run: >
          xcodebuild -project apple/HomeyDeck.xcodeproj -scheme HomeyDeck
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath build
          CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
          MARKETING_VERSION="${TAG#v}" build
      - name: Build iOS app (unsigned)
        run: >
          xcodebuild -project apple/HomeyDeck.xcodeproj -scheme HomeyDeck
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="${TAG#v}" build
      - name: Package
        run: |
          mkdir -p out Payload
          ditto -c -k --keepParent build/Build/Products/Release/HomeyDeck.app out/HomeyDeck-macOS.zip
          cp -R build/Build/Products/Release-iphoneos/HomeyDeck.app Payload/
          zip -qry out/HomeyDeck-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: out/*

  publish:
    needs: [agent, apple]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "HomeyDeck $TAG" \
            --notes-file .github/release-notes.md
